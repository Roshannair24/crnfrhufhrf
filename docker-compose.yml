services:
  backend:
    build:
      context: ./gridbricks-backend
    ports:
      - "5000:5000"
    environment:
      # Origin the backend's CORS should allow. Change if you serve the
      # frontend from somewhere other than localhost:3000.
      - FRONTEND_URL=http://localhost:3000
    restart: unless-stopped

  # frontend:
