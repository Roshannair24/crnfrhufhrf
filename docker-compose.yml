  #       # frontend Dockerfile). It must be a URL reachable from the
  #       # BROWSER, not the container network — the browser calls the
  #       # backend directly, not through the frontend container. Since
  #       # docker-compose publishes the backend on localhost:5000, that's
  #       # what works for local use.
  #       NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
